[package]
name = "proxysheet-studio"
version = "0.1.0"
description = "Offline card sheet and custom proxy PDF generator."
authors = ["Devin"]
edition = "2021"

[lib]
name = "proxysheet_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
